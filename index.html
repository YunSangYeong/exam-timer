<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시험용 스톱워치 · 타이머</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}.app{width:min(100%,1000px);padding:clamp(16px,3vw,40px);text-align:center}.tabs{display:flex;gap:10px;justify-content:center}.tabs button,.controls button,.presets button{border:1px solid #53627a;border-radius:12px;background:#25344b;color:white;padding:12px 18px;font-size:clamp(16px,1.8vw,22px);cursor:pointer}.tabs button.active{background:#146de0;border-color:#69a8ff}h1{font-size:clamp(20px,2.5vw,32px);font-weight:650}.clock{font-variant-numeric:tabular-nums;font-size:clamp(55px,10vw,150px);font-weight:750;letter-spacing:-.055em;white-space:nowrap;margin:20px 0}.clock small{font-size:.28em;font-weight:600;letter-spacing:0;margin:0 .12em 0 .04em;vertical-align:middle}.clock.warning{color:#ffb74d}.clock.done{color:#ff6464}.settings{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.settings label{font-size:18px}.settings input{width:88px;padding:10px;border-radius:10px;border:1px solid #7789a4;background:#1c2a40;color:white;font-size:22px;text-align:center}.presets,.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}.controls button.primary{background:#1673ed;border-color:#1673ed}.controls button:disabled{opacity:.45;cursor:not-allowed}.hint{color:#b8c8dd;font-size:15px;line-height:1.6}.hidden{display:none!important}.status{min-height:24px;color:#f8c66d;font-weight:600}@media(max-width:520px){.app{padding:12px}.clock{font-size:clamp(48px,13vw,85px)}.settings input{width:70px}.tabs button,.controls button,.presets button{padding:10px 12px;font-size:16px}}</style></head><body><main class="app"><div class="tabs"><button id="stopTab" class="active" aria-pressed="true">⏱ 스톱워치</button><button id="timerTab" aria-pressed="false">⏳ 타이머</button></div><h1 id="heading">시험 경과 시간</h1><section id="timerSettings" class="hidden"><div class="settings"><label><input id="hours" type="number" min="0" max="99" value="1" inputmode="numeric"> 시간</label><label><input id="minutes" type="number" min="0" max="59" value="0" inputmode="numeric"> 분</label><label><input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric"> 초</label></div><div class="presets"><button data-min="30">30분</button><button data-min="60">60분</button><button data-min="90">90분</button><button data-min="120">120분</button></div></section><div id="clock" class="clock" role="timer" aria-label="시간"><span>00</span><small>시</small> <span>00</span><small>분</small> <span>00</span><small>초</small></div><div id="status" class="status" aria-live="polite"></div><div class="controls"><button id="start" class="primary">시작</button><button id="pause" disabled>일시정지</button><button id="reset">초기화</button><button id="full">전체화면</button></div><p class="hint">시험지는 왼쪽 모니터, 이 화면은 오른쪽 모니터에 놓으세요.<br>시작·일시정지: 스페이스바 / 초기화: R (입력칸 선택 중 제외)</p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let mode='stop',running=false,elapsed=0,remaining=3600000,startedAt=0,base=0,raf=0,finished=false;const fmt=ms=>{let s=Math.max(0,Math.ceil(ms/1000));if(mode==='stop')s=Math.floor(Math.max(0,ms)/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')};function duration(){const h=Number($('hours').value),m=Number($('minutes').value),s=Number($('seconds').value);if(![h,m,s].every(Number.isInteger)||h<0||h>99||m<0||m>59||s<0||s>59)return null;return ((h*60+m)*60+s)*1000}function render(){let value=mode==='stop'?elapsed:remaining;const parts=fmt(value).split(':');$('clock').innerHTML=`<span>${parts[0]}</span><small>시</small> <span>${parts[1]}</span><small>분</small> <span>${parts[2]}</span><small>초</small>`;$('clock').classList.toggle('warning',mode==='timer'&&value>0&&value<=300000);$('clock').classList.toggle('done',mode==='timer'&&finished);$('start').disabled=running||finished;$('pause').disabled=!running;$('start').textContent=elapsed>0&&mode==='stop'||mode==='timer'&&remaining<duration()?'계속':'시작';$('status').textContent=finished?'시험 시간이 종료되었습니다!':running?'측정 중':'';document.title=fmt(value)+' | 시험 '+(mode==='stop'?'스톱워치':'타이머')}function tick(){if(!running)return;const passed=performance.now()-startedAt;if(mode==='stop')elapsed=base+passed;else{remaining=Math.max(0,base-passed);if(remaining===0){running=false;finished=true;beep()}}render();if(running)raf=requestAnimationFrame(tick)}function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.17);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.18)});setTimeout(()=>ctx.close(),1200)}catch(e){}}function stop(){running=false;cancelAnimationFrame(raf)}function reset(){stop();elapsed=0;finished=false;remaining=duration()??3600000;render()}function setMode(next){stop();mode=next;$('stopTab').classList.toggle('active',mode==='stop');$('timerTab').classList.toggle('active',mode==='timer');$('stopTab').setAttribute('aria-pressed',mode==='stop');$('timerTab').setAttribute('aria-pressed',mode==='timer');$('timerSettings').classList.toggle('hidden',mode!=='timer');$('heading').textContent=mode==='stop'?'시험 경과 시간':'시험 남은 시간';reset()}$('stopTab').onclick=()=>setMode('stop');$('timerTab').onclick=()=>setMode('timer');$('start').onclick=()=>{if(running||finished)return;if(mode==='timer'){if(remaining<=0)return;const d=duration();if(d===null||d===0){$('status').textContent='올바른 시험 시간을 입력하세요.';return}}base=mode==='stop'?elapsed:remaining;startedAt=performance.now();running=true;tick()};$('pause').onclick=()=>{if(!running)return;stop();render()};$('reset').onclick=reset;$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};['hours','minutes','seconds'].forEach(id=>$(id).addEventListener('input',()=>{if(mode==='timer'&&!running){elapsed=0;finished=false;remaining=duration()??0;render()}}));document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.min);$('hours').value=Math.floor(n/60);$('minutes').value=n%60;$('seconds').value=0;reset()});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)||e.repeat)return;if(e.code==='Space'){e.preventDefault();(running?$('pause'):$('start')).click()}else if(e.key.toLowerCase()==='r')reset()});render()})();</script></body></html>
